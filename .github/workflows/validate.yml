name: Validate plugin artifacts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate the single Claude and Codex plugin
        run: python scripts/validate_plugins.py
      - name: Compile maintained Python files
        run: python -m compileall -q scripts hooks mcp skills
